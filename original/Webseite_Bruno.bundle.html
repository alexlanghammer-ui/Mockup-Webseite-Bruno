  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cad38935-f926-4271-9aa3-5a9dcdee2120\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"1bd3698e-a54e-4634-80c0-fe73882b2ec8\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"cad38935-f926-4271-9aa3-5a9dcdee2120\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html {\n    --bg: #FBF7F1; --surface: #FFFCF7; --sunk: #F5EEE5;\n    --ink: #2B1B15; --ink-soft: #6B564C; --ink-faint: #8A7568;\n    --line: #E5D9CD; --line-soft: #EFE6DB;\n    --rose: #A9635E; --rose-air: rgba(232,194,191,.42); --rose-ring: rgba(232,194,191,.75);\n    --green: #2E5943; --on-green: #FDF9F4;\n    --scrim: rgba(251,247,241,.72);\n    --field: #FFFCF7;\n  }\n  html[data-theme=\"dark\"] {\n    --bg: #1A1310; --surface: #241A16; --sunk: #130E0C;\n    --ink: #F5ECE3; --ink-soft: #C0AEA1; --ink-faint: #9C8A7D;\n    --line: #3A2C25; --line-soft: #2E221D;\n    --rose: #EFAFA9; --rose-air: rgba(232,194,191,.14); --rose-ring: rgba(232,194,191,.35);\n    --green: #8FBB9E; --on-green: #14231A;\n    --scrim: rgba(26,19,16,.7);\n    --field: #1F1713;\n  }\n  html, body { margin: 0; padding: 0; background: var(--bg); }\n  * { box-sizing: border-box; }\n  a { color: var(--rose); text-decoration: none; }\n  a:hover { color: var(--ink); }\n  button, input, textarea { font-family: 'Outfit', system-ui, sans-serif; }\n  @keyframes brunoUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }\n  @keyframes brunoFade { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes brunoBlink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }\n  @keyframes brunoNudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }\n  @keyframes brunoSteam { 0% { opacity: .15; transform: translateY(4px); } 50% { opacity: .7; transform: translateY(-4px); } 100% { opacity: .15; transform: translateY(4px); } }\n  @keyframes brunoDraw { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }\n<\u002Fstyle>\n<script src=\"630921c0-6372-4e40-8e81-8b7d994b3512\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--bg);color:var(--ink);container-type:inline-size;overflow-x:clip;font-family:'Outfit',system-ui,sans-serif\">\n\n  <div style=\"position:relative;overflow:hidden\">\n\n    <div style=\"{{ artLeft }}\">\n      <svg sc-camel-view-box=\"0 0 200 220\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"2.1\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" style=\"width:100%;height:100%;color:var(--rose)\">\n        <ellipse cx=\"100\" cy=\"76\" rx=\"48\" ry=\"12\"><\u002Fellipse>\n        <path d=\"M52 76 L60 158 Q62 176 82 176 L118 176 Q138 176 140 158 L148 76\"><\u002Fpath>\n        <path d=\"M148 98 Q182 102 178 126 Q174 146 146 146\"><\u002Fpath>\n        <ellipse cx=\"100\" cy=\"192\" rx=\"72\" ry=\"11\"><\u002Fellipse>\n        <path d=\"M88 44 Q78 30 88 16\" style=\"animation:brunoSteam 4.6s ease-in-out infinite\"><\u002Fpath>\n        <path d=\"M112 48 Q102 32 112 18\" style=\"animation:brunoSteam 4.6s ease-in-out .9s infinite\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div style=\"{{ artRight }}\">\n      <svg sc-camel-view-box=\"0 0 200 220\" fill=\"none\" stroke=\"currentColor\" sc-camel-stroke-width=\"2.1\" sc-camel-stroke-linecap=\"round\" sc-camel-stroke-linejoin=\"round\" style=\"width:100%;height:100%;color:var(--rose)\">\n        <path d=\"M34 44 L166 44\"><\u002Fpath>\n        <path d=\"M40 48 L100 128 L160 48\"><\u002Fpath>\n        <path d=\"M56 62 L144 62\"><\u002Fpath>\n        <path d=\"M100 128 L100 184\"><\u002Fpath>\n        <ellipse cx=\"100\" cy=\"190\" rx=\"38\" ry=\"8\"><\u002Fellipse>\n        <path d=\"M150 26 L120 68\"><\u002Fpath>\n        <circle cx=\"117\" cy=\"74\" r=\"9\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute;inset:0;background:var(--scrim);pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%, var(--rose-air), rgba(0,0,0,0) 64%);pointer-events:none\"><\u002Fdiv>\n\n    <div style=\"position:relative;z-index:5;max-width:1180px;margin:0 auto;padding:clamp(22px,3.4cqw,44px) clamp(20px,5cqw,64px) clamp(30px,4cqw,54px);text-align:center\">\n      <sc-if value=\"{{ light }}\" hint-placeholder-val=\"{{ true }}\">\n        <img src=\"ca582f27-23d8-4466-bea6-68ac6049adf6\" alt=\"Bruno Café &amp; Bar\" sc-camel-on-click=\"{{ nav.home }}\" style=\"width:clamp(122px,13cqw,176px);height:auto;display:block;margin:0 auto;cursor:pointer;animation:brunoFade .9s ease both\">\n      <\u002Fsc-if>\n      <sc-if value=\"{{ dark }}\" hint-placeholder-val=\"{{ false }}\">\n        <img src=\"dd3c525b-73e2-4d90-9e01-84a6fa59e7f1\" alt=\"Bruno Café &amp; Bar\" sc-camel-on-click=\"{{ nav.home }}\" style=\"width:clamp(122px,13cqw,176px);height:auto;display:block;margin:0 auto;cursor:pointer;animation:brunoFade .9s ease both\">\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ wide }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(14px,2.4cqw,32px);margin-top:clamp(16px,2.4cqw,26px);animation:brunoFade 1s ease .1s both\">\n          <a href=\"#\" sc-camel-on-click=\"{{ nav.home }}\" style=\"{{ lnk.home }}\">Start<\u002Fa>\n          <a href=\"#\" sc-camel-on-click=\"{{ nav.karte }}\" style=\"{{ lnk.karte }}\">Speisekarte<\u002Fa>\n          <a href=\"#\" sc-camel-on-click=\"{{ nav.zeiten }}\" style=\"{{ lnk.zeiten }}\">Öffnungszeiten<\u002Fa>\n          <a href=\"#\" sc-camel-on-click=\"{{ nav.anfahrt }}\" style=\"{{ lnk.anfahrt }}\">Anfahrt<\u002Fa>\n          <a href=\"#\" sc-camel-on-click=\"{{ nav.kontakt }}\" style=\"{{ lnk.kontakt }}\">Kontakt<\u002Fa>\n          <a href=\"#\" sc-camel-on-click=\"{{ nav.res }}\" style=\"{{ lnk.res }}\">Reservierung<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:16px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleNav }}\" style=\"background:transparent;border:none;color:var(--ink);font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;padding:8px 4px;cursor:pointer\">{{ navLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ navOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:8px;animation:brunoUp .35s ease both\">\n              <a href=\"#\" sc-camel-on-click=\"{{ nav.home }}\" style=\"color:var(--ink);font-size:22px;font-weight:200;letter-spacing:-.01em;padding:9px 0\">Start<\u002Fa>\n              <a href=\"#\" sc-camel-on-click=\"{{ nav.karte }}\" style=\"color:var(--ink);font-size:22px;font-weight:200;letter-spacing:-.01em;padding:9px 0\">Speisekarte<\u002Fa>\n              <a href=\"#\" sc-camel-on-click=\"{{ nav.zeiten }}\" style=\"color:var(--ink);font-size:22px;font-weight:200;letter-spacing:-.01em;padding:9px 0\">Öffnungszeiten<\u002Fa>\n              <a href=\"#\" sc-camel-on-click=\"{{ nav.anfahrt }}\" style=\"color:var(--ink);font-size:22px;font-weight:200;letter-spacing:-.01em;padding:9px 0\">Anfahrt<\u002Fa>\n              <a href=\"#\" sc-camel-on-click=\"{{ nav.kontakt }}\" style=\"color:var(--ink);font-size:22px;font-weight:200;letter-spacing:-.01em;padding:9px 0\">Kontakt<\u002Fa>\n              <a href=\"#\" sc-camel-on-click=\"{{ nav.res }}\" style=\"color:var(--rose);font-size:22px;font-weight:200;letter-spacing:-.01em;padding:9px 0\">Reservierung<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ rHome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding-top:clamp(30px,5cqw,66px)\">\n          <div style=\"display:inline-flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:clamp(20px,3cqw,34px);animation:brunoUp .8s cubic-bezier(.2,.7,.2,1) .18s both\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:var(--rose);display:inline-block;animation:brunoBlink 2.8s ease-in-out infinite\"><\u002Fspan>\n            <span>{{ phaseLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"font-size:clamp(34px,7.4cqw,102px);font-weight:200;line-height:.99;letter-spacing:-.045em;margin:0;color:var(--ink);white-space:nowrap\">\n            <span style=\"display:block;animation:brunoUp 1s cubic-bezier(.16,.8,.24,1) .24s both\">Coffee first.<\u002Fspan>\n            <span style=\"display:block;animation:brunoUp 1s cubic-bezier(.16,.8,.24,1) .38s both\">Cocktail second.<\u002Fspan>\n            <span style=\"display:block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--rose);animation:brunoUp 1s cubic-bezier(.16,.8,.24,1) .52s both\">Der Rest passiert.<\u002Fspan>\n          <\u002Fh1>\n          <p style=\"font-size:clamp(16px,1.7cqw,20px);font-weight:300;line-height:1.65;color:var(--ink-soft);max-width:44ch;margin:clamp(20px,3cqw,34px) auto 0;text-wrap:pretty;animation:brunoUp 1s cubic-bezier(.2,.7,.2,1) .64s both\">{{ phaseLine }}<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:clamp(24px,3.4cqw,38px);animation:brunoUp 1s cubic-bezier(.2,.7,.2,1) .76s both\">\n            <button type=\"button\" sc-camel-on-click=\"{{ nav.karte }}\" style=\"background:var(--green);color:var(--on-green);border:none;border-radius:999px;padding:16px 30px;font-size:15.5px;font-weight:500;cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .3s ease\" style-hover=\"transform:translateY(-3px);opacity:.9\">Speisekarte<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ nav.res }}\" style=\"background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:16px 30px;font-size:15.5px;font-weight:400;cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s ease\" style-hover=\"transform:translateY(-3px);border-color:var(--rose)\">Tisch reservieren<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:center;gap:9px;margin-top:clamp(30px,4cqw,52px);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)\">\n            <span>Mehr<\u002Fspan>\n            <span style=\"display:inline-block;animation:brunoNudge 2.4s ease-in-out infinite\">↓<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ rHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div>\n      <div style=\"background:var(--surface);border-top:1px solid var(--line-soft);padding:clamp(46px,8cqw,116px) clamp(20px,5cqw,64px)\">\n        <div data-reveal=\"about\" style=\"opacity:0;transform:translateY(24px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);max-width:1340px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(22px,4cqw,64px);align-items:start\">\n          <div>\n            <div style=\"font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);margin-bottom:14px\">Was Bruno ist<\u002Fdiv>\n            <h2 style=\"font-size:clamp(28px,4.2cqw,54px);font-weight:200;line-height:1.06;letter-spacing:-.035em;margin:0\">Ein Wohnzimmer<br>mit guter Theke.<\u002Fh2>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 16px;font-size:clamp(16px,1.7cqw,19px);font-weight:300;line-height:1.7;color:var(--ink-soft);text-wrap:pretty\">Café, Bar und Küche in einem Raum in der Tübinger Straße. Morgens riecht es nach Filterkaffee und Zimtschnecken, mittags nach dem, was auf der Tafel steht, abends nach Zitronenschale und Eis.<\u002Fp>\n            <p style=\"margin:0;font-size:clamp(16px,1.7cqw,19px);font-weight:300;line-height:1.7;color:var(--ink-soft);text-wrap:pretty\">Keine Reservierungspflicht, kein Dresscode, keine Karte in vier Sprachen. Nur ein Ort, an dem man um zehn Uhr morgens genauso richtig sitzt wie um Mitternacht.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--surface);padding:0 clamp(20px,5cqw,64px) clamp(46px,8cqw,116px)\">\n        <div data-reveal=\"pic\" style=\"opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);max-width:1340px;margin:0 auto;border-radius:24px;overflow:hidden;aspect-ratio:16/9;background:var(--sunk)\">\n          <image-slot id=\"bruno-room\" shape=\"rect\" placeholder=\"Foto vom Laden hier ablegen (quer)\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--bg);padding:clamp(46px,8cqw,116px) clamp(20px,5cqw,64px);text-align:center\">\n        <div data-reveal=\"claim\" style=\"opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);max-width:1000px;margin:0 auto\">\n          <div style=\"font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--rose);margin-bottom:clamp(16px,2.6cqw,28px)\">Die Küche<\u002Fdiv>\n          <div style=\"font-size:clamp(34px,7.2cqw,96px);font-weight:200;line-height:.98;letter-spacing:-.045em;color:var(--ink)\">Essen bringt<\u002Fdiv>\n          <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--rose);font-size:clamp(40px,8.4cqw,112px);line-height:1;letter-spacing:-.03em\">Gefühle<\u002Fdiv>\n          <p style=\"font-size:clamp(16px,1.7cqw,20px);font-weight:300;line-height:1.7;color:var(--ink-soft);max-width:44ch;margin:clamp(20px,3cqw,34px) auto clamp(24px,3.4cqw,34px);text-wrap:pretty\">Klein und ehrlich gekocht: eine Tafel, ein paar Gerichte, viel Gemüse, Zutaten von Leuten, die wir kennen. Was aus ist, ist aus.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ nav.karte }}\" style=\"background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:15px 30px;font-size:15px;font-weight:400;cursor:pointer;transition:border-color .3s ease,transform .3s ease\" style-hover=\"border-color:var(--rose);transform:translateY(-2px)\">Zur Speisekarte<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--surface);border-top:1px solid var(--line-soft);padding:clamp(46px,8cqw,116px) clamp(20px,5cqw,64px)\">\n        <div style=\"max-width:1340px;margin:0 auto\">\n          <div data-reveal=\"tlHead\" style=\"opacity:0;transform:translateY(22px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:clamp(26px,4cqw,50px)\">\n            <h2 style=\"font-size:clamp(28px,4.2cqw,54px);font-weight:200;line-height:1.06;letter-spacing:-.035em;margin:0;max-width:16ch\">Ein Tag, drei Stimmungen.<\u002Fh2>\n            <div style=\"font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose)\">Tübinger Str. 82<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"{{ tlGrid }}\">\n            <div data-reveal=\"t1\" style=\"opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.2,.7,.2,1),transform .85s cubic-bezier(.2,.7,.2,1);position:relative;padding-top:26px;border-top:1px solid var(--line)\">\n              <span style=\"{{ dot1 }}\"><\u002Fspan>\n              <div style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:10px\">08 — 12<\u002Fdiv>\n              <div style=\"font-size:clamp(26px,3.2cqw,38px);font-weight:200;letter-spacing:-.03em;line-height:1.05;margin-bottom:10px\">Morgens<\u002Fdiv>\n              <p style=\"margin:0;color:var(--ink-soft);font-size:16.5px;font-weight:300;line-height:1.65;text-wrap:pretty\">Filterkaffee, Zimtschnecken aus dem Ofen, Zeitung. Tische, an denen man auch allein sitzen darf.<\u002Fp>\n            <\u002Fdiv>\n            <div data-reveal=\"t2\" style=\"opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.2,.7,.2,1) .09s,transform .85s cubic-bezier(.2,.7,.2,1) .09s;position:relative;padding-top:26px;border-top:1px solid var(--line)\">\n              <span style=\"{{ dot2 }}\"><\u002Fspan>\n              <div style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:10px\">12 — 17<\u002Fdiv>\n              <div style=\"font-size:clamp(26px,3.2cqw,38px);font-weight:200;letter-spacing:-.03em;line-height:1.05;margin-bottom:10px\">Mittags<\u002Fdiv>\n              <p style=\"margin:0;color:var(--ink-soft);font-size:16.5px;font-weight:300;line-height:1.65;text-wrap:pretty\">Warme Küche durchgehend. Pasta, Bowls, viel Gemüse — und Platz für lange Pausen.<\u002Fp>\n            <\u002Fdiv>\n            <div data-reveal=\"t3\" style=\"opacity:0;transform:translateY(26px);transition:opacity .85s cubic-bezier(.2,.7,.2,1) .18s,transform .85s cubic-bezier(.2,.7,.2,1) .18s;position:relative;padding-top:26px;border-top:1px solid var(--line)\">\n              <span style=\"{{ dot3 }}\"><\u002Fspan>\n              <div style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:10px\">17 — spät<\u002Fdiv>\n              <div style=\"font-size:clamp(26px,3.2cqw,38px);font-weight:200;letter-spacing:-.03em;line-height:1.05;margin-bottom:10px\">Abends<\u002Fdiv>\n              <p style=\"margin:0;color:var(--ink-soft);font-size:16.5px;font-weight:300;line-height:1.65;text-wrap:pretty\">Cocktails, offene Weine, kleine Teller. Nie zu laut, selten früh, meistens eine Runde mehr.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ rKarte }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:clamp(10px,2cqw,26px) clamp(20px,5cqw,64px) clamp(52px,8cqw,110px)\">\n      <div style=\"max-width:1000px;margin:0 auto\">\n        <div style=\"font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);margin-bottom:12px\">Essen &amp; Trinken<\u002Fdiv>\n        <h1 style=\"font-size:clamp(34px,6cqw,76px);font-weight:200;line-height:1;letter-spacing:-.04em;margin:0 0 14px\">Speisekarte<\u002Fh1>\n        <p style=\"margin:0 0 clamp(24px,3.4cqw,38px);color:var(--ink-soft);font-size:16.5px;font-weight:300;line-height:1.7;max-width:48ch;text-wrap:pretty\">Alle Preise in Euro inkl. MwSt. Die Tageskarte steht auf der Tafel — frag uns einfach, was heute gut ist.<\u002Fp>\n\n        <div style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:clamp(22px,3cqw,36px)\">\n          <sc-for list=\"{{ catTabs }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button type=\"button\" sc-camel-on-click=\"{{ c.select }}\" style=\"{{ c.style }}\">{{ c.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ cats }}\" as=\"cat\" hint-placeholder-count=\"2\">\n          <div style=\"margin-bottom:clamp(34px,5cqw,58px)\">\n            <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:4px\">\n              <h2 style=\"font-size:clamp(24px,3.6cqw,42px);font-weight:200;letter-spacing:-.03em;line-height:1;margin:0\">{{ cat.name }}<\u002Fh2>\n              <span style=\"flex:1;height:1px;background:var(--line)\"><\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px;color:var(--ink-faint);font-size:14px;font-weight:300;letter-spacing:.02em\">{{ cat.note }}<\u002Fp>\n            <sc-for list=\"{{ cat.items }}\" as=\"item\" hint-placeholder-count=\"5\">\n              <div style=\"padding:13px 0;border-bottom:1px solid var(--line-soft)\">\n                <div style=\"display:flex;align-items:baseline;gap:10px\">\n                  <span style=\"font-size:17px;font-weight:400\">{{ item.name }}<\u002Fspan>\n                  <sc-if value=\"{{ item.out }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap\">Heute aus<\u002Fspan>\n                  <\u002Fsc-if>\n                  <span style=\"flex:1;border-bottom:1px dotted var(--line)\"><\u002Fspan>\n                  <span style=\"font-size:17px;font-weight:400;white-space:nowrap\">{{ item.priceLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"color:var(--ink-soft);font-size:15px;font-weight:300;line-height:1.5;margin-top:4px;max-width:54ch\">{{ item.desc }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ rZeiten }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:clamp(10px,2cqw,26px) clamp(20px,5cqw,64px) clamp(52px,8cqw,110px)\">\n      <div style=\"max-width:900px;margin:0 auto\">\n        <div style=\"font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);margin-bottom:12px\">Wann<\u002Fdiv>\n        <h1 style=\"font-size:clamp(34px,6cqw,76px);font-weight:200;line-height:1;letter-spacing:-.04em;margin:0 0 clamp(24px,3.4cqw,42px)\">Öffnungszeiten<\u002Fh1>\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(14px,2.4cqw,28px) clamp(18px,3cqw,34px)\">\n          <sc-for list=\"{{ hours }}\" as=\"row\" hint-placeholder-count=\"7\">\n            <div style=\"{{ row.rowStyle }}\">\n              <span style=\"{{ row.dayStyle }}\">{{ row.d }}<\u002Fspan>\n              <span style=\"{{ row.timeStyle }}\">{{ row.t }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:clamp(20px,3cqw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px\">\n          <div style=\"background:var(--sunk);border-radius:18px;padding:20px 22px\">\n            <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:8px\">Küche<\u002Fdiv>\n            <p style=\"margin:0;color:var(--ink-soft);font-size:16px;font-weight:300;line-height:1.6\">Warme Küche von 12 bis 22 Uhr, kleine Teller danach.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--sunk);border-radius:18px;padding:20px 22px\">\n            <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:8px\">Feiertage<\u002Fdiv>\n            <p style=\"margin:0;color:var(--ink-soft);font-size:16px;font-weight:300;line-height:1.6\">An Feiertagen wie sonntags geöffnet. Ausnahmen stehen an der Tür.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--sunk);border-radius:18px;padding:20px 22px\">\n            <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:8px\">Gerade jetzt<\u002Fdiv>\n            <p style=\"margin:0;color:var(--ink);font-size:16px;font-weight:400;line-height:1.6\">{{ phaseLabel }} · {{ todayShort }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ rAnfahrt }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:clamp(10px,2cqw,26px) clamp(20px,5cqw,64px) clamp(52px,8cqw,110px)\">\n      <div style=\"max-width:1100px;margin:0 auto\">\n        <div style=\"font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);margin-bottom:12px\">Wo<\u002Fdiv>\n        <h1 style=\"font-size:clamp(34px,6cqw,76px);font-weight:200;line-height:1;letter-spacing:-.04em;margin:0 0 clamp(24px,3.4cqw,42px)\">Anfahrt<\u002Fh1>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(22px,3.4cqw,48px)\">\n          <div>\n            <div style=\"font-size:clamp(22px,2.8cqw,30px);font-weight:200;line-height:1.35;letter-spacing:-.02em\">Bruno Café &amp; Bar<br>Tübinger Str. 82<br>70178 Stuttgart-Süd<\u002Fdiv>\n            <div style=\"margin-top:clamp(20px,3cqw,32px);display:flex;flex-direction:column;gap:16px\">\n              <div>\n                <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:6px\">Stadtbahn<\u002Fdiv>\n                <p style=\"margin:0;color:var(--ink-soft);font-size:16.5px;font-weight:300;line-height:1.6\">U1 / U9 bis Bihlplatz, dann drei Minuten die Tübinger Straße hinauf.<\u002Fp>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:6px\">Bus<\u002Fdiv>\n                <p style=\"margin:0;color:var(--ink-soft);font-size:16.5px;font-weight:300;line-height:1.6\">Linie 42 bis Marienplatz — von dort um die Ecke.<\u002Fp>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:6px\">Rad &amp; Auto<\u002Fdiv>\n                <p style=\"margin:0;color:var(--ink-soft);font-size:16.5px;font-weight:300;line-height:1.6\">Bügel direkt vor der Tür. Parken im Viertel ist Glückssache — abends besser die Bahn.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"border-radius:22px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)\">\n              <image-slot id=\"bruno-map\" shape=\"rect\" placeholder=\"Kartenausschnitt hier ablegen\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ rKontakt }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:clamp(10px,2cqw,26px) clamp(20px,5cqw,64px) clamp(52px,8cqw,110px)\">\n      <div style=\"max-width:900px;margin:0 auto\">\n        <div style=\"font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);margin-bottom:12px\">Sag Hallo<\u002Fdiv>\n        <h1 style=\"font-size:clamp(34px,6cqw,76px);font-weight:200;line-height:1;letter-spacing:-.04em;margin:0 0 16px\">Kontakt<\u002Fh1>\n        <p style=\"margin:0 0 clamp(24px,3.4cqw,40px);color:var(--ink-soft);font-size:clamp(16px,1.7cqw,19px);font-weight:300;line-height:1.7;max-width:46ch;text-wrap:pretty\">Für große Runden, Fundsachen, Feiern oder Bewerbungen — ruf an oder schreib uns. Wir antworten meist am selben Tag.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px\">\n          <a href=\"tel:+4971112345678\" style=\"background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3cqw,32px);display:block;color:var(--ink);transition:border-color .3s ease,transform .3s ease\" style-hover=\"border-color:var(--rose);transform:translateY(-3px)\">\n            <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:10px\">Telefon<\u002Fdiv>\n            <div style=\"font-size:clamp(20px,2.4cqw,27px);font-weight:200;letter-spacing:-.01em\">0711 / 123 456 78<\u002Fdiv>\n            <div style=\"margin-top:8px;color:var(--ink-soft);font-size:15px;font-weight:300\">Täglich ab 8 Uhr erreichbar<\u002Fdiv>\n          <\u002Fa>\n          <a href=\"mailto:hallo@bruno-stuttgart.de\" style=\"background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,3cqw,32px);display:block;color:var(--ink);transition:border-color .3s ease,transform .3s ease\" style-hover=\"border-color:var(--rose);transform:translateY(-3px)\">\n            <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);margin-bottom:10px\">E-Mail<\u002Fdiv>\n            <div style=\"font-size:clamp(18px,2.1cqw,24px);font-weight:200;letter-spacing:-.01em;word-break:break-word\">hallo@bruno-stuttgart.de<\u002Fdiv>\n            <div style=\"margin-top:8px;color:var(--ink-soft);font-size:15px;font-weight:300\">Antwort in der Regel am selben Tag<\u002Fdiv>\n          <\u002Fa>\n        <\u002Fdiv>\n        <div style=\"margin-top:clamp(20px,3cqw,32px);background:var(--sunk);border-radius:22px;padding:clamp(22px,3cqw,32px);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between\">\n          <div>\n            <div style=\"font-size:clamp(20px,2.4cqw,26px);font-weight:200;letter-spacing:-.02em\">Lieber direkt einen Tisch?<\u002Fdiv>\n            <div style=\"color:var(--ink-soft);font-size:16px;font-weight:300;margin-top:6px\"> nd:var(--field);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;color:var(--ink)\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:7px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)\">Anlass (optional)\n                <input type=\"text\" placeholder=\"Geburtstag, Feierabend …\" value=\"{{ res.occasion }}\" sc-camel-on-change=\"{{ f.occasion }}\" style=\"background:var(--field);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;color:var(--ink)\">\n              <\u002Flabel>\n            <\u002Fdiv>\n\n            <label style=\"display:flex;flex-direction:column;gap:7px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:14px\">Anmerkungen\n              <textarea rows=\"3\" placeholder=\"Allergien, Kinderwagen, Lieblingsecke …\" value=\"{{ res.notes }}\" sc-camel-on-change=\"{{ f.notes }}\" style=\"background:var(--field);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;color:var(--ink);resize:vertical;font-family:'Outfit',sans-serif\"><\u002Ftextarea>\n            <\u002Flabel>\n\n            <sc-if value=\"{{ resError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px;border:1px solid var(--rose);color:var(--ink);border-radius:12px;padding:13px 16px;font-size:15px\">Datum, Uhrzeit, Name und E-Mail brauchen wir noch.<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <button type=\"button\" sc-camel-on-click=\"{{ submitRes }}\" style=\"margin-top:24px;width:100%;background:var(--green);color:var(--on-green);border:none;border-radius:999px;padding:18px;font-size:16px;font-weight:500;cursor:pointer;transition:opacity .3s ease\" style-hover=\"opacity:.9\">Anfrage senden<\u002Fbutton>\n            <p style=\"margin:12px 0 0;color:var(--ink-faint);font-size:13.5px;font-weight:300;line-height:1.6\">Noch keine feste Reservier em;text-transform:uppercase;cursor:pointer;padding:4px 0\">{{ themeNote }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst HOURS = [\n  { d: 'Montag', t: '08:00 – 00:00' },\n  { d: 'Dienstag', t: '08:00 – 00:00' },\n  { d: 'Mittwoch', t: '08:00 – 00:00' },\n  { d: 'Donnerstag', t: '08:00 – 01:00' },\n  { d: 'Freitag', t: '08:00 – 02:00' },\n  { d: 'Samstag', t: '09:00 – 02:00' },\n  { d: 'Sonntag', t: '09:00 – 18:00' }\n];\n\nconst SUNRISE = [8.2, 7.6, 6.7, 6.6, 5.6, 5.3, 5.5, 6.2, 7.0, 7.7, 7.5, 8.1];\nconst SUNSET  = [16.8, 17.6, 18.4, 20.2, 21.0, 21.5, 21.4, 20.7, 19.6, 18.5, 16.7, 16.3];\n\nconst AREAS = ['Drinnen', 'Draußen', 'Theke', 'Egal'];\n\nconst MENU = [\n  { id: 'kaffee', name: 'Kaffee', note: 'Bohnen aus Stuttgart geröstet · Hafer ohne Aufpreis', items: [\n    { name: 'Espresso', desc: 'Doppelt 3,40', price: '2,40' },\n    { name: 'Cappuccino', desc: '', price: '3,60' },\n    { name: 'Flat White', desc: 'Der Standard hier', price: '4,20' },\n    { name: 'Filterkaffee', desc: 'Wechselnder Single Origin, Kanne 5,80', price: '3,20' },\n    { name: 'Cold Brew', desc: '18 Stunden, ohne Eile', price: '4,50' },\n    { name: 'Chai Latte', desc: 'Selbst angesetzt, mild scharf', price: '4,40' }\n  ]},\n  { id: 'fruehstueck', name: 'Frühstück', note: 'Bis 15 Uhr, am Wochenende bis 16 Uhr', items: [\n    { name: 'Bruno Bowl', desc: 'Joghurt, Granola, Obst, Honig', price: '9,50' },\n    { name: 'Rührei auf Sauerteig', desc: 'Drei Eier, Schnittlauch, gute Butter', price: '10,50' },\n    { name: 'Avocado Toast', desc: 'Sauerteig, Limette, Chili, Sesam', price: '11,00' },\n    { name: 'Shakshuka', desc: 'Zwei Eier, Tomate, Feta, Brot zum Tunken', price: '12,50' },\n    { name: 'Zimtschnecke', desc: 'Morgens gebacken, mittags meistens weg', price: '4,20' },\n    { name: 'Frühstücksbrett für zwei', desc: 'Einmal quer durch die Karte', price: '24,00' }\n  ]},\n  { id: ame: 'Ingwer-Zitrone-Spritz', desc: 'Scharf, spritzig, wach', price: '5,50' },\n    { name: 'Alkoholfreier Sour', desc: 'Mit Seedlip, Zitrone, Honig', price: '8,50' },\n    { name: 'Apfelschorle', desc: '0,4 l, naturtrüb', price: '3,80' },\n    { name: 'Mineralwasser', desc: '0,25 l, still oder laut', price: '2,90' }\n  ]}\n];\n\nfunction emptyRes() {\n  return { date: '', time: '19:00', guests: 2, name: '', email: '', phone: '', occasion: '', notes: '', area: 'Drinnen' };\n}\n\nclass Component extends DCLogic {\n  state = {\n    route: 'home', vw: 1200, navOpen: false, themeOverride: null, now: new Date(),\n    cat: 'alle', res: emptyRes(), resSent: false, resError: false, last: null\n  };\n  _seen = {};\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ vw: window.innerWidth });\n    window.addEventListener('resize', this._onResize);\n    this.setState({ vw: window.innerWidth });\n    this._clock = setInterval(() => this.setState({ now: new Date() }), 60000);\n    this._applyTheme();\n    this._setupReveal();\n    setTimeout(() => this._revealAll(), 3200);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    clearInterval(this._clock);\n    if (this._io) this._io.disconnect();\n  }\n\n  componentDidUpdate() {\n    this._applyTheme();\n    Object.keys(this._seen).forEach(k => this._show(document.querySelector('[data-reveal=\"' + k + '\"]')));\n    this._setupReveal();\n  }\n\n  isDark() {\n    if (this.state.themeOverride) return this.state.themeOverride === 'dark';\n    const n = this.state.now;\n    const h = n.getHours() + n.getMinutes() / 60;\n    return h < SUNRISE[n.getMonth()] || h >= SUNSET[n.getMonth()];\n  }\n\n  _applyTheme() {\n    document.documentElement.setAttribute('data-theme', this.isDark() ? 'dark' : 'light');\n  }\n\n  _show(el) { if (el) { el.style.opacity = '1'; el.style.transform = 'none'; } }\n\n  _revealAll() {\n    const nodes = document.querySelectorAll('[data-reveal]');\n    for (let i = 0; i < nodes.length; i++) {\n      this._seen[nodes[i].getAttribute('data-reveal')] = true;\n      this._show(nodes[i]);\n    }\n  }\n\n  _setupReveal() {\n    if (!window.IntersectionObserver) { this._revealAll(); return; }\n    if (!this._io) {\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach(en => {\n          if (en.isIntersecting) {\n            this._seen[en.target.getAttribute('data-reveal')] = true;\n            this._show(en.target);\n            this._io.unobserve(en.target);\n          }\n        });\n      }, { rootMargin: '0px 0px -10% 0px', threshold: 0.06 });\n    }\n    const nodes = document.querySelectorAll('[data-reveal]');\n    for (let i = 0; i < nodes.length; i++) {\n      const k = nodes[i].getAttribute('data-reveal');\n      if (this._seen[k]) this._show(nodes[i]); else this._io.observe(nodes[i]);\n    }\n  }\n\n  go(route) {\n    return (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      this.setState({ route: route, navOpen: false });\n      if (window.scrollTo) window.scrollTo({ top: 0, behavior: 'smooth' });\n    };\n  }\n\n  phase() {\n    const h = this.state.now.getHours();\n    return h < 11 ? 0 : (h < 17 ? 1 : 2);\n  }\n\n  fmtDate(d) {\n    if (!d) return '';\n    const p = String(d).split('-');\n    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : d;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const narrow = s.vw < 900;\n    const dark = this.isDark();\n    const ph = this.phase();\n    const todayIdx = (s.now.getDay() + 6) % 7;\n\n    const nav = {};\n    ['home', 'karte', 'zeiten', 'anfahrt', 'kontakt', 'res'].forEach(r => { nav[r] = this.go(r); });\n\n    const link = (active) => ({\n      color: active ? 'var(--ink)' : 'var(--ink-soft)',\n      fontSize: 11.5, letterSpacing: '.2em', textTransform: 'uppercase', fontWeight: 400,\n      borderBottom: active ? '1px solid var(--rose)' : '1px solid transparent',\n      paddingBottom: 4, transition: 'color .3s ease'\n    });\n\n    const set = (k) => (e) => {\n      const v = e.target.value;\n      this.setState(st => ({ res: Object.assign({}, st.res, { [k]: v }) }));\n    };\n\n    const pill = (active) => ({\n      background: active ? 'var(--ink)' : 'transparent',\n      color: active ? 'var(--bg)' : 'var(--ink)',\n      border: '1px solid ' + (active ? 'var(--ink)' : 'var(--line)'),\n      borderRadius: 999, padding: '10px 17px', fontSize: 14, fontWeight: 400,\n      cursor: 'pointer', whiteSpace: 'nowrap'\n    });\n\n    const dot = (active) => ({\n      position: 'absolute', top: -6, left: 0, width: 11, height: 11, borderRadius: '50%',\n      background: 'var(--rose)', display: 'block',\n      boxShadow: active ? '0 0 0 5px var(--rose-ring)' : 'none'\n    });\n\n    // Kaffeetasse links, Cocktailglas rechts — die aktive Tageszeit tritt hervor\n    const art = (side, strong) => {\n      const base = {\n        position: 'absolute',\n        width: narrow ? '56cqw' : '30cqw',\n        maxWidth: narrow ? 300 : 420,\n        aspectRatio: '200 / 220',\n        display: s.route === 'home' ? 'block' : 'none',\n        opacity: strong ? (dark ? 0.5 : 0.42) : (dark ? 0.16 : 0.14),\n        transform: strong ? 'rotate(0deg) scale(1)' : 'rotate(0deg) scale(.92)',\n        transition: 'opacity 1.2s ease, transform 1.2s ease',\n        pointerEvents: 'none'\n      };\n      if (narrow) {\n        return Object.assign({}, base, side === 'left'\n          ? { top: '2%', left: '-16%' }\n          : { bottom: '-6%', right: '-18%' });\n      }\n      return Object.assign({}, base, side === 'left'\n        ? { top: '30%', left: '2%' }\n        : { top: '34%', right: '2%' });\n    };\n\n    const PHASES = [\n      { label: 'Kaffee-Zeit', line: 'Gerade läuft der Filter. Zimtschnecken sind noch warm, die Zeitung liegt auf dem Tresen.' },\n      { label: 'Lunch & Snacks', line: 'Die Küche ist offen: Pasta, Bowls, kleine Teller. Nimm dir ruhig die lange Pause.' },\n      { label: 'Cocktail-Zeit', line: 'Eis ist im Glas. Sours, offene Weine und kleine Teller bis spät.' }\n    ];\n\n    const shown = s.cat === 'alle' ? MENU : MENU.filter(c => c.id === s.cat);\n    const catTabs = [{ id: 'alle', name: 'Alles' }].concat(MENU.map(c => ({ id: c.id, name: c.name }))).map(c => ({\n      name: c.name, style: pill(s.cat === c.id),\n      select: () => this.setState({ cat: c.id })\n    }));\n\n    const submitRes = () => {\n      const r = s.res;\n      if (!r.date || !r.time || !r.name || !r.email) { this.setState({ resError: true }); return; }\n      this.setState({ resSent: true, resError: false, last: r, res: emptyRes() });\n      if (window.scrollTo) window.scrollTo({ top: 0, behavior: 'smooth' });\n    };\n\n    return {\n      dark: dark, light: !dark,\n      themeNote: dark ? 'Dunkel — antippen für hell' : 'Hell — antippen für dunkel',\n      toggleTheme: () => this.setState({ themeOverride: this.isDark() ? 'light' : 'dark' }),\n\n      wide: !narrow, narrow,\n      navOpen: s.navOpen, navLabel: s.navOpen ? 'Schließen' : 'Menü',\n      toggleNav: () => this.setState(st => ({ navOpen: !st.navOpen })),\n      nav,\n      lnk: {\n        home: link(s.route === 'home'), karte: link(s.route === 'karte'),\n        zeiten: link(s.route === 'zeiten'), anfahrt: link(s.route === 'anfahrt'),\n        kontakt: link(s.route === 'kontakt'), res: link(s.route === 'res')\n      },\n\n      rHome: s.route === 'home', rKarte: s.route === 'karte', rZeiten: s.route === 'zeiten',\n      rAnfahrt: s.route === 'anfahrt', rKontakt: s.route === 'kontakt', rRes: s.route === 'res',\n\n      artLeft: art('left', ph !== 2),\n      artRight: art('right', ph === 2),\n\n      phaseLabel: PHASES[ph].label,\n      phaseLine: PHASES[ph].line,\n      todayShort: 'Heute ' + HOURS[todayIdx].t,\n\n      dot1: dot(ph === 0), dot2: dot(ph === 1), dot3: dot(ph === 2),\n\n      tlGrid: {\n        display: 'grid',\n        gridTemplateColumns: narrow ? '1fr' : 'repeat(3, 1fr)',\n        gap: narrow ? 32 : 'clamp(22px,3cqw,48px)'\n      },\n\n      catTabs,\n      cats: shown.map(c => ({\n        name: c.name, note: c.note,\n        items: c.items.map(i => ({ name: i.name, desc: i.desc, out: !!i.out, priceLabel: i.price + ' €' }))\n      })),\n\n      hours: HOURS.map((r, i) => ({\n        d: r.d, t: r.t,\n        rowStyle: {\n          display: 'flex', justifyContent: 'space-between', gap: 14, padding: '14px 0',\n          borderBottom: i === 6 ? 'none' : '1px solid var(--line-soft)'\n        },\n        dayStyle: { fontSize: 16.5, fontWeight: i === todayIdx ? 500 : 300, color: 'var(--ink)' },\n        timeStyle: { fontSize: 16.5, fontWeight: i === todayIdx ? 500 : 300, color: i === todayIdx ? 'var(--ink)' : 'var(--ink-soft)' }\n      })),\n\n      res: s.res,\n      f: {\n        date: set('date'), time: set('time'), guests: set('guests'), name: set('name'),\n        email: set('email'), phone: set('phone'), occasion: set('occasion'), notes: set('notes')\n      },\n      areas: AREAS.map(a => ({\n        label: a, style: pill(s.res.area === a),\n        select: () => this.setState(st => ({ res: Object.assign({}, st.res, { area: a }) }))\n      })),\n      resSent: s.resSent, resForm: !s.resSent, resError: s.resError,\n      resAgain: () => this.setState({ resSent: false, last: null }),\n      submitRes,\n      lastName: s.last ? s.last.name : '',\n      lastSummary: s.last ? (s.last.guests + ' Personen am ' + this.fmtDate(s.last.date) + ' um ' + s.last.time + ' Uhr, ' + s.last.area) : ''\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
