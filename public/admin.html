<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speisekarte bearbeiten — Bruno</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/rechtstexte.css">
<style>
  body { padding-bottom: 120px; }
  .schmal { max-width: 820px; }

  input, textarea, button { font-family: inherit; font-size: 16px; }

  .feld {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--ink);
  }
  .feld:focus { outline: 2px solid var(--rose); outline-offset: 1px; }

  label.klein {
    display: block;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }

  .knopf {
    background: var(--green);
    color: var(--on-green);
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    font-weight: 500;
    cursor: pointer;
  }
  .knopf:disabled { opacity: .5; cursor: default; }

  .knopf-leise {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .knopf-leise:hover { border-color: var(--rose); color: var(--ink); }

  .kategorie {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(16px, 3vw, 24px);
    margin-bottom: 18px;
  }
  .kopfzeile {
    display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .kopfzeile > div:first-child { flex: 1 1 240px; }

  .gericht {
    display: grid;
    grid-template-columns: 1fr 1.3fr 90px auto;
    gap: 8px;
    align-items: end;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  @media (max-width: 700px) {
    .gericht { grid-template-columns: 1fr auto; }
    .gericht .spanne { grid-column: 1 / -1; }
  }

  .werkzeuge { display: flex; gap: 5px; }
  .werkzeuge button {
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    width: 32px; height: 32px; cursor: pointer; color: var(--ink-soft); font-size: 14px;
  }
  .werkzeuge button:hover { border-color: var(--rose); color: var(--ink); }
  .werkzeuge button.loeschen:hover { border-color: #C4544E; color: #C4544E; }

  .leiste {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--sunk); border-top: 1px solid var(--line);
    padding: 14px clamp(20px, 5vw, 40px);
    display: flex; gap: 14px; align-items: center; justify-content: space-between;
    flex-wrap: wrap;
  }
  .leiste .inner {
    max-width: 820px; margin: 0 auto; width: 100%;
    display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }

  .meldung { font-size: 14.5px; color: var(--ink-soft); }
  .meldung.fehler { color: #C4544E; }
  .meldung.gut { color: var(--ink); }

  .hinweis-box {
    border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 24px;
    font-size: 14.5px; color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="wrap schmal">
  <a class="zurueck" href="index.html">← Zur Webseite</a>

  <!-- ---------------- Anmeldung ---------------- -->
  <section id="anmeldung" hidden>
    <h1>Anmelden</h1>
    <p style="color:var(--ink-soft)">Hier änderst du die Speisekarte der Webseite.</p>
    <form id="loginForm" style="margin-top:26px;max-width:380px">
      <label class="klein" for="passwort">Passwort</label>
      <input class="feld" type="password" id="passwort" autocomplete="current-password" required>
      <button class="knopf" type="submit" style="margin-top:16px">Anmelden</button>
      <p class="meldung" id="loginMeldung" style="margin-top:14px"></p>
    </form>
  </section>

  <!-- ---------------- Editor ---------------- -->
  <section id="editor" hidden>
    <h1>Speisekarte</h1>

    <div class="hinweis-box">
      Änderungen werden erst mit <strong>Speichern</strong> übernommen und sind
      danach sofort auf der Webseite sichtbar. Die Beschreibung darf leer
      bleiben, der Preis auch — dann steht dort einfach nichts.
    </div>

    <div id="liste"></div>

    <button class="knopf-leise" id="neueKategorie" style="margin-top:6px">+ Kategorie hinzufügen</button>
  </section>
</div>

<div class="leiste" id="leiste" hidden>
  <div class="inner">
    <span class="meldung" id="meldung"></span>
    <span style="display:flex;gap:10px;align-items:center">
      <button class="knopf-leise" id="abmelden">Abmelden</button>
      <button class="knopf" id="speichern">Speichern</button>
    </span>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Gleiche Tag-/Nacht-Logik wie der Rest der Seite.
  var SUNRISE = [8.2, 7.6, 6.7, 6.6, 5.6, 5.3, 5.5, 6.2, 7.0, 7.7, 7.5, 8.1];
  var SUNSET  = [16.8, 17.6, 18.4, 20.2, 21.0, 21.5, 21.4, 20.7, 19.6, 18.5, 16.7, 16.3];
  (function () {
    var n = new Date(), h = n.getHours() + n.getMinutes() / 60;
    document.documentElement.setAttribute(
      'data-theme', (h < SUNRISE[n.getMonth()] || h >= SUNSET[n.getMonth()]) ? 'dark' : 'light');
  })();

  var karte = [];
  var offen = false;   // ungespeicherte Änderungen?

  var $ = function (id) { return document.getElementById(id); };

  function melde(text, art) {
    var el = $('meldung');
    el.textContent = text;
    el.className = 'meldung' + (art ? ' ' + art : '');
  }

  function api(koerper) {
    return fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(koerper)
    }).then(function (r) {
      return r.json().catch(function () { return {}; })
        .then(function (b) { return { ok: r.ok, status: r.status, body: b }; });
    });
  }

  /* ---------------- Aufbau der Oberfläche ---------------- */

  function feld(wert, platzhalter, beiAenderung) {
    var i = document.createElement('input');
    i.className = 'feld';
    i.type = 'text';
    i.value = wert || '';
    i.placeholder = platzhalter;
    i.addEventListener('input', function () { beiAenderung(i.value); offen = true; melde('Nicht gespeichert.'); });
    return i;
  }

  function werkzeug(zeichen, titel, klasse, beiKlick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = zeichen;
    b.title = titel;
    b.setAttribute('aria-label', titel);
    if (klasse) b.className = klasse;
    b.addEventListener('click', beiKlick);
    return b;
  }

  function tausche(liste, von, nach) {
    if (nach < 0 || nach >= liste.length) return false;
    var x = liste[von]; liste[von] = liste[nach]; liste[nach] = x;
    return true;
  }

  function zeichne() {
    var liste = $('liste');
    liste.textContent = '';

    karte.forEach(function (kat, ki) {
      var box = document.createElement('div');
      box.className = 'kategorie';

      // Kopfzeile: Name, Notiz, Werkzeuge
      var kopf = document.createElement('div');
      kopf.className = 'kopfzeile';

      var nameSpalte = document.createElement('div');
      var l1 = document.createElement('label');
      l1.className = 'klein'; l1.textContent = 'Kategorie';
      nameSpalte.appendChild(l1);
      nameSpalte.appendChild(feld(kat.name, 'z. B. Kaffee', function (v) { kat.name = v; }));
      kopf.appendChild(nameSpalte);

      var wz = document.createElement('div');
      wz.className = 'werkzeuge';
      wz.appendChild(werkzeug('↑', 'Kategorie nach oben', '', function () {
        if (tausche(karte, ki, ki - 1)) { offen = true; zeichne(); melde('Nicht gespeichert.'); }
      }));
      wz.appendChild(werkzeug('↓', 'Kategorie nach unten', '', function () {
        if (tausche(karte, ki, ki + 1)) { offen = true; zeichne(); melde('Nicht gespeichert.'); }
      }));
      wz.appendChild(werkzeug('✕', 'Kategorie löschen', 'loeschen', function () {
        if (!confirm('Kategorie "' + (kat.name || 'ohne Namen') + '" mit allen Einträgen löschen?')) return;
        karte.splice(ki, 1); offen = true; zeichne(); melde('Nicht gespeichert.');
      }));
      kopf.appendChild(wz);
      box.appendChild(kopf);

      var l2 = document.createElement('label');
      l2.className = 'klein'; l2.textContent = 'Notiz unter der Überschrift (optional)';
      box.appendChild(l2);
      box.appendChild(feld(kat.note, 'z. B. Bohnen aus Stuttgart geröstet',
        function (v) { kat.note = v; }));

      // Gerichte
      kat.items.forEach(function (g, gi) {
        var zeile = document.createElement('div');
        zeile.className = 'gericht';

        var s1 = document.createElement('div');
        var la = document.createElement('label');
        la.className = 'klein'; la.textContent = 'Name';
        s1.appendChild(la);
        s1.appendChild(feld(g.name, 'z. B. Cappuccino', function (v) { g.name = v; }));
        zeile.appendChild(s1);

        var s2 = document.createElement('div');
        s2.className = 'spanne';
        var lb = document.createElement('label');
        lb.className = 'klein'; lb.textContent = 'Beschreibung';
        s2.appendChild(lb);
        s2.appendChild(feld(g.desc, 'optional', function (v) { g.desc = v; }));
        zeile.appendChild(s2);

        var s3 = document.createElement('div');
        var lc = document.createElement('label');
        lc.className = 'klein'; lc.textContent = 'Preis';
        s3.appendChild(lc);
        s3.appendChild(feld(g.price, '3,60', function (v) { g.price = v; }));
        zeile.appendChild(s3);

        var wz2 = document.createElement('div');
        wz2.className = 'werkzeuge';
        wz2.appendChild(werkzeug('↑', 'Nach oben', '', function () {
          if (tausche(kat.items, gi, gi - 1)) { offen = true; zeichne(); melde('Nicht gespeichert.'); }
        }));
        wz2.appendChild(werkzeug('↓', 'Nach unten', '', function () {
          if (tausche(kat.items, gi, gi + 1)) { offen = true; zeichne(); melde('Nicht gespeichert.'); }
        }));
        wz2.appendChild(werkzeug('✕', 'Eintrag löschen', 'loeschen', function () {
          kat.items.splice(gi, 1); offen = true; zeichne(); melde('Nicht gespeichert.');
        }));
        zeile.appendChild(wz2);

        box.appendChild(zeile);
      });

      var plus = document.createElement('button');
      plus.type = 'button';
      plus.className = 'knopf-leise';
      plus.style.marginTop = '12px';
      plus.textContent = '+ Eintrag';
      plus.addEventListener('click', function () {
        kat.items.push({ name: '', desc: '', price: '' });
        offen = true; zeichne(); melde('Nicht gespeichert.');
      });
      box.appendChild(plus);

      liste.appendChild(box);
    });
  }

  /* ---------------- Laden und Speichern ---------------- */

  function ladeKarte() {
    return fetch('/api/karte', { cache: 'no-store' }).then(function (r) {
      if (r.status === 200) return r.json();
      // Noch nichts gespeichert: mit der eingebauten Karte starten.
      return fetch('assets/speisekarte-standard.json').then(function (r2) { return r2.json(); });
    });
  }

  function zeigeEditor() {
    return ladeKarte().then(function (k) {
      karte = k;
      $('anmeldung').hidden = true;
      $('editor').hidden = false;
      $('leiste').hidden = false;
      zeichne();
      melde('');
    });
  }

  function zeigeAnmeldung() {
    $('anmeldung').hidden = false;
    $('editor').hidden = true;
    $('leiste').hidden = true;
    $('passwort').focus();
  }

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var m = $('loginMeldung');
    m.textContent = 'Moment …';
    m.className = 'meldung';
    api({ aktion: 'login', passwort: $('passwort').value }).then(function (a) {
      if (!a.ok) {
        m.textContent = a.body.error || 'Anmeldung fehlgeschlagen.';
        m.className = 'meldung fehler';
        return;
      }
      $('passwort').value = '';
      m.textContent = '';
      zeigeEditor();
    }).catch(function () {
      m.textContent = 'Keine Verbindung zum Server.';
      m.className = 'meldung fehler';
    });
  });

  $('neueKategorie').addEventListener('click', function () {
    karte.push({ name: '', note: '', items: [{ name: '', desc: '', price: '' }] });
    offen = true;
    zeichne();
    melde('Nicht gespeichert.');
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });

  $('speichern').addEventListener('click', function () {
    var b = $('speichern');
    b.disabled = true;
    melde('Wird gespeichert …');
    api({ aktion: 'speichern', karte: karte }).then(function (a) {
      b.disabled = false;
      if (a.status === 401) { melde('Sitzung abgelaufen — bitte neu anmelden.', 'fehler'); zeigeAnmeldung(); return; }
      if (!a.ok) { melde(a.body.error || 'Speichern fehlgeschlagen.', 'fehler'); return; }
      karte = a.body.karte;   // der Server hat aufgeräumt (Kennungen, Leerzeichen)
      offen = false;
      zeichne();
      melde('Gespeichert. Die Webseite zeigt die neue Karte.', 'gut');
    }).catch(function () {
      b.disabled = false;
      melde('Keine Verbindung zum Server.', 'fehler');
    });
  });

  $('abmelden').addEventListener('click', function () {
    if (offen && !confirm('Es gibt ungespeicherte Änderungen. Trotzdem abmelden?')) return;
    api({ aktion: 'logout' }).then(function () { offen = false; location.reload(); });
  });

  window.addEventListener('beforeunload', function (e) {
    if (offen) { e.preventDefault(); e.returnValue = ''; }
  });

  // Beim Aufruf prüfen, ob noch eine Sitzung läuft.
  api({ aktion: 'status' }).then(function (a) {
    if (a.body && a.body.angemeldet) zeigeEditor(); else zeigeAnmeldung();
  }).catch(function () {
    zeigeAnmeldung();
    $('loginMeldung').textContent = 'Server nicht erreichbar — läuft die Seite bei Cloudflare?';
    $('loginMeldung').className = 'meldung fehler';
  });
})();
</script>

</body>
</html>
